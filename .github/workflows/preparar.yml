name: Preparar e verificar posts

# Sempre que entrar post novo: converte PNG -> JPEG e confere legenda,
# hashtags e mídias. Se algo estiver errado, o check fica vermelho.
on:
  push:
    branches: [main]
    paths: ['posts/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run preparar
      - name: Salvar JPEGs gerados
        run: |
          git add posts
          if ! git diff --cached --quiet; then
            git config user.name "luric-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Converte imagens para JPEG"
            git pull --rebase
            git push
          fi
      - run: npm run verificar
