name: Publicar no Instagram

on:
  schedule:
    # De hora em hora, das 8h às 20h de Brasília (11h–23h UTC), no minuto 7.
    # O script só publica o que já chegou na hora e ainda não saiu.
    - cron: '7 11-23 * * *'
  workflow_dispatch:
    inputs:
      post:
        description: 'Publicar agora um post específico (nome da pasta, ex.: 2027-01-05-carrossel). Vazio = o que estiver na hora.'
        required: false
      simular:
        description: 'Só simular (não publica)'
        type: boolean
        default: false

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.post }}" ]; then ARGS="$ARGS --post ${{ inputs.post }}"; fi
          if [ "${{ inputs.simular }}" = "true" ]; then ARGS="$ARGS --simular"; fi
          node scripts/publicar.mjs $ARGS

      - name: Registrar publicados
        if: always()
        run: |
          if ! git diff --quiet publicados.json; then
            git config user.name "luric-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publicados.json
            git commit -m "Publicado no Instagram: $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
